services:
  - type: web
    name: waste-tracker-104
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SEED_SAMPLE
        value: "true"
      - key: SMS_PROVIDER
        value: dryrun
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
